services:
  dev-management:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-management
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
      - "${WS_PORT:-3001}:3001"
    environment:
      # Database
      - DATABASE_URL=file:/data/app.db
      
      # Auth.js
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      
      # Encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      
      # Ollama Server
      - OLLAMA_SERVER_URL=${OLLAMA_SERVER_URL:-http://10.10.10.216:11434}
      
      # Application
      - NODE_ENV=production
    volumes:
      # Persist SQLite database
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/hosts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge

volumes:
  dev-data:
